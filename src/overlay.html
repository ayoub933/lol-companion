<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>LoL Companion · objets</title>
    <!-- Panneau posé sur le jeu (en tenant Tab, ou toute la partie) : les icônes numérotées, collées au bord gauche,
         à mi-hauteur. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* La fenêtre fait 34 % de la hauteur de l'écran du jeu : 1 unité = 1 pixel sur un écran 1080p. */
      :root {
        --u: calc(100vh / 367);
      }
      #panel {
        position: absolute;
        left: calc(12 * var(--u));
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: calc(13 * var(--u));
      }
      .row {
        display: flex;
        align-items: flex-end;
        gap: calc(6 * var(--u));
      }
      /* Ordre d'achat (1. = départ), « + » : la suite, « VS » : contre l'équipe d'en face. */
      .num {
        width: calc(22 * var(--u));
        align-self: center;
        text-align: right;
        font: 700 calc(15 * var(--u)) / 1 "Segoe UI", system-ui, sans-serif;
        color: #f0e6d2;
        text-shadow:
          0 0 calc(3 * var(--u)) #000,
          0 calc(1 * var(--u)) calc(2 * var(--u)) #000;
      }
      .icon {
        position: relative;
        border-radius: calc(4 * var(--u));
        overflow: hidden;
        box-shadow: 0 calc(1 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, 0.7);
      }
      .icon img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .main {
        width: calc(40 * var(--u));
        height: calc(40 * var(--u));
      }
      .starter {
        width: calc(34 * var(--u));
        height: calc(34 * var(--u));
      }
      .boots {
        width: calc(30 * var(--u));
        height: calc(30 * var(--u));
      }
      /* Autre choix possible : plus petit et un peu effacé. */
      .alt {
        width: calc(30 * var(--u));
        height: calc(30 * var(--u));
        opacity: 0.75;
      }
      /* Choix suivants et objets contre l'équipe d'en face. */
      .option {
        width: calc(30 * var(--u));
        height: calc(30 * var(--u));
      }
      .row.more .num,
      .row.vs .num {
        font-size: calc(11 * var(--u));
        letter-spacing: 0.04em;
      }
      /* Prochaine étape à acheter : numéro doré, icônes cerclées d'or. */
      .row.next .num {
        color: #ffcf4a;
      }
      .row.next .icon {
        box-shadow:
          0 0 0 calc(2 * var(--u)) #ffcf4a,
          0 calc(1 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, 0.7);
      }
      /* Étape faite, objet acheté : grisés ; l'objet acheté porte une coche. */
      .row.done .num {
        color: #9a9a9a;
      }
      .row.done .icon img,
      .icon.owned img {
        filter: grayscale(1) brightness(0.45);
      }
      .icon.owned::after {
        content: "✓";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #7dffb0;
        font: 700 calc(17 * var(--u)) / 1 "Segoe UI", system-ui, sans-serif;
        text-shadow: 0 0 calc(3 * var(--u)) #000;
      }
      /* Pourquoi cet objet contre l'équipe d'en face (soins, AD, AP, tanks), sous son icône. */
      .with-reason {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(2 * var(--u));
      }
      .reason {
        color: #f0e6d2;
        font: 600 calc(9 * var(--u)) / 1 "Segoe UI", system-ui, sans-serif;
        text-transform: uppercase;
        text-shadow:
          0 0 calc(3 * var(--u)) #000,
          0 calc(1 * var(--u)) calc(2 * var(--u)) #000;
      }
      .count {
        position: absolute;
        right: 0;
        bottom: 0;
        padding: 0 calc(3 * var(--u));
        border-top-left-radius: calc(3 * var(--u));
        background: rgba(0, 0, 0, 0.8);
        color: #f2f2f2;
        font: calc(11 * var(--u)) / 1.2 "Segoe UI", system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <script>
      const { invoke, convertFileSrc } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const panel = document.getElementById("panel");
      // Build affiché, pour ne pas tout redessiner à chaque mise à jour de la partie.
      let shown = "";

      // Icône d'un objet, servie par l'app depuis le client (lcu://localhost/item-<numéro>).
      function icon(item) {
        const box = document.createElement("div");
        box.className = `icon ${item.size}${item.owned ? " owned" : ""}`;
        const img = document.createElement("img");
        img.alt = "";
        img.src = convertFileSrc(`item-${item.id}`, "lcu");
        // Le client peut être lent juste au début de la partie : un second essai.
        img.addEventListener("error", () => {
          if (img.dataset.retry) return;
          img.dataset.retry = "1";
          setTimeout(() => (img.src = `${convertFileSrc(`item-${item.id}`, "lcu")}?retry`), 2000);
        });
        box.append(img);
        if (item.count > 1) {
          const count = document.createElement("span");
          count.className = "count";
          count.textContent = `×${item.count}`;
          box.append(count);
        }
        if (!item.reason) return box;
        const wrap = document.createElement("div");
        wrap.className = "with-reason";
        const reason = document.createElement("span");
        reason.className = "reason";
        reason.textContent = item.reason;
        wrap.append(box, reason);
        return wrap;
      }

      // Une rangée : son numéro dans l'ordre d'achat (ou « + », « VS »), puis ses objets.
      function row(line) {
        const div = document.createElement("div");
        const kind = line.label === "+" ? " more" : line.label === "VS" ? " vs" : "";
        div.className = `row${kind}${line.done ? " done" : ""}${line.next ? " next" : ""}`;
        const num = document.createElement("span");
        num.className = "num";
        num.textContent = line.label;
        div.append(num, ...line.items.map(icon));
        return div;
      }

      // Les rangées viennent de l'app, de haut en bas : départ, 1er objet (et son autre choix), bottes,
      // 2e objet (et son autre choix), 3e objet, la suite (+), et contre l'équipe d'en face (VS). Rien ne
      // disparaît : ce qui est acheté est grisé, la prochaine étape mise en avant.
      function render(state) {
        const rows = state?.game?.panel ?? [];
        const key = JSON.stringify(rows);
        if (key === shown) return;
        shown = key;
        panel.replaceChildren(...rows.map(row));
      }

      window.addEventListener("DOMContentLoaded", async () => {
        await listen("lol-state", (event) => render(event.payload));
        render(await invoke("get_state"));
      });
    </script>
  </body>
</html>
