# Publie une version : à chaque tag « v… » (ex. v0.8.0), GitHub construit l'installateur Windows,
# le signe pour les mises à jour automatiques, et le met dans une « Release » avec le fichier latest.json
# que l'app consulte au démarrage.
name: Publier une version

on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Le projet n'utilise pas npm : on installe juste l'outil de Tauri qui fabrique l'installateur.
      - name: Installer la CLI Tauri
        run: npm install --global @tauri-apps/cli@^2

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'LoL Companion ${{ github.ref_name }}'
          releaseBody: 'Installe (ou mets à jour) avec le fichier « …_x64-setup.exe » ci-dessous.'
          releaseDraft: false
          prerelease: false
